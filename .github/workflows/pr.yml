# Gates every pull request before a person can merge it (and so before it deploys):
#   - tests: the whole build and test suite (Testcontainers needs Docker, which the runner has)
#   - decisions: no team spec may have a DECISION a person hasn't confirmed (workflow/bin/check-decisions)
#   - not-work: the shared agent board branch `work` never merges into main (.claude/rules/work-branch.md)
# Make them required checks on main (Settings → Branches) so a red PR can't be merged.
name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
      - name: Cache ~/.m2
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: m2-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: m2-
      - name: Build and test
        run: ./mvnw -B package

  not-work:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The work board never merges into main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = work ]; then
            echo "::error::'work' is the agent board and never merges into main (.claude/rules/work-branch.md). Close this PR."
            exit 1
          fi

  decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Every decision confirmed by a person
        run: workflow/bin/check-decisions
      - name: Every API status has a Hurl request (workflow/lessons.md L5)
        run: |
          for spec in workflow/specs/*.md; do
            [ -e "$spec" ] || continue
            slug="$(basename "$spec" .md)"
            if [ -f "examples/$slug.hurl" ]; then workflow/bin/check-hurl-statuses "$slug"; fi
          done
