server.port=8080

# The database comes from PGHOST, PGPORT, PGDATABASE, PGUSER and PGPASSWORD. sslmode is off for the
# Compose Postgres here; the Dockerfile sets PGSSLMODE=require for the container.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:cfp}?sslmode=${PGSSLMODE:disable}
spring.datasource.username=${PGUSER:cfp}
spring.datasource.password=${PGPASSWORD:cfp}
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=always

management.endpoints.web.exposure.include=health,info
# Boot 4 turns the liveness/readiness groups on by default, which changes /actuator/health's body.
management.endpoint.health.probes.enabled=false

# Kept from the 2019 setup, the mobile client depends on some of these
# (Boot 4 renamed these; the old keys are silently ignored.)
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.servlet.encoding.force=true
# Tomcat 9 (Boot 2.7) accepted 10000 request parameters, Tomcat 11 only 1000.
server.tomcat.max-parameter-count=10000
spring.jackson.json.read.allow-java-comments=true
# Boot 4 uses Jackson 3, whose defaults differ (alphabetical property order, failing on trailing tokens and on null
# for primitives, ...). Keep Jackson 2's, so the JSON our clients get and send is unchanged.
spring.jackson.use-jackson2-defaults=true
# Jackson 2 wrote characters outside the BMP (emoji) as \uD83C\uDFA4 escapes; Jackson 3 writes them raw.
spring.jackson.json.write.combine-unicode-surrogates-in-utf8=false

#logging.level.org.springframework.jdbc.core=DEBUG
